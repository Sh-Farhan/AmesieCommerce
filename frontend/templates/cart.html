{% extends "base.html" %}

{% block title %}Shopping Cart - Shopease{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-8">
            <h2 class="mb-4">
                <i class="fas fa-shopping-cart me-2"></i>Shopping Cart
            </h2>
            
            <div id="cart-container">
                <!-- Cart items will be loaded here -->
            </div>
        </div>
        
        <div class="col-lg-4">
            <div class="checkout-summary">
                <h5 class="mb-4">Order Summary</h5>
                
                <div id="cart-summary">
                    <!-- Cart summary will be updated here -->
                </div>
                
                <button class="btn btn-primary w-100 btn-lg mt-4" onclick="proceedToCheckout()">
                    <i class="fas fa-credit-card me-2"></i>Proceed to Checkout
                </button>
                
                <div class="text-center mt-3">
                    <a href="/products" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Override updateCartDisplay to also update summary
const originalUpdateCartDisplay = window.updateCartDisplay;
window.updateCartDisplay = function() {
    originalUpdateCartDisplay.call(this);
    updateCartSummary();
};

function updateCartSummary() {
    const summaryContainer = document.getElementById('cart-summary');
    if (!summaryContainer || !cart) return;
    
    let subtotal = 0;
    cart.forEach(item => {
        subtotal += item.product.price * item.quantity;
    });
    
    const shipping = subtotal > 500 ? 0 : 50;
    const total = subtotal + shipping;
    
    summaryContainer.innerHTML = `
        <div class="summary-item">
            <span>Subtotal</span>
            <span>₹${subtotal}</span>
        </div>
        <div class="summary-item">
            <span>Shipping</span>
            <span>${shipping === 0 ? 'Free' : '₹' + shipping}</span>
        </div>
        <div class="summary-item">
            <span>Total</span>
            <span>₹${total}</span>
        </div>
        ${subtotal < 500 ? '<small class="text-muted">Free shipping on orders over ₹500</small>' : ''}
    `;
}
</script>
{% endblock %}
