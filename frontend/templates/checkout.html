{% extends "base.html" %}

{% block title %}Checkout - Shopease{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-8">
            <h2 class="mb-4">
                <i class="fas fa-credit-card me-2"></i>Checkout
            </h2>
            
            <form id="checkout-form">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Shipping Information</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="full_name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="full_name" name="full_name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" name="phone" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="address_line1" class="form-label">Address Line 1</label>
                            <input type="text" class="form-control" id="address_line1" name="address_line1" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="address_line2" class="form-label">Address Line 2 (Optional)</label>
                            <input type="text" class="form-control" id="address_line2" name="address_line2">
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="city" class="form-label">City</label>
                                <input type="text" class="form-control" id="city" name="city" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="state" class="form-label">State</label>
                                <input type="text" class="form-control" id="state" name="state" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="postal_code" class="form-label">Postal Code</label>
                                <input type="text" class="form-control" id="postal_code" name="postal_code" required>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Payment Method</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <img src="https://razorpay.com/favicon.png" alt="Razorpay" width="24" height="24" class="me-2">
                            <span>Secure payment powered by Razorpay</span>
                        </div>
                        <small class="text-muted">Supports all major credit cards, debit cards, net banking, and UPI</small>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fas fa-lock me-2"></i>Place Order
                </button>
            </form>
        </div>
        
        <div class="col-lg-4">
            <div class="checkout-summary">
                <h5 class="mb-4">Order Review</h5>
                
                <div id="order-items">
                    <!-- Order items will be loaded here -->
                </div>
                
                <hr>
                
                <div id="order-total">
                    <!-- Order total will be calculated here -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Load checkout data on page load
document.addEventListener('DOMContentLoaded', async () => {
    if (!currentUser) {
        showAlert('Please log in to checkout', 'error');
        window.location.href = '/login';
        return;
    }
    
    // Pre-fill user information
    if (currentUser) {
        document.getElementById('full_name').value = currentUser.full_name || '';
        document.getElementById('phone').value = currentUser.phone_number || '';
    }
    
    // Display order items
    displayOrderItems();
});

function displayOrderItems() {
    const itemsContainer = document.getElementById('order-items');
    const totalContainer = document.getElementById('order-total');
    
    if (!cart || cart.length === 0) {
        itemsContainer.innerHTML = '<p class="text-muted">No items in cart</p>';
        return;
    }
    
    let subtotal = 0;
    
    itemsContainer.innerHTML = cart.map(item => {
        const itemTotal = item.product.price * item.quantity;
        subtotal += itemTotal;
        
        return `
            <div class="d-flex align-items-center mb-3">
                <img src="${item.product.image_url || 'https://via.placeholder.com/50x50'}" 
                     alt="${item.product.name}" 
                     style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                <div class="ms-3 flex-grow-1">
                    <h6 class="mb-0">${item.product.name}</h6>
                    <small class="text-muted">Qty: ${item.quantity}</small>
                </div>
                <div class="text-end">
                    <div class="fw-bold">₹${itemTotal}</div>
                </div>
            </div>
        `;
    }).join('');
    
    const shipping = subtotal > 500 ? 0 : 50;
    const total = subtotal + shipping;
    
    totalContainer.innerHTML = `
        <div class="summary-item">
            <span>Subtotal</span>
            <span>₹${subtotal}</span>
        </div>
        <div class="summary-item">
            <span>Shipping</span>
            <span>${shipping === 0 ? 'Free' : '₹' + shipping}</span>
        </div>
        <div class="summary-item">
            <span><strong>Total</strong></span>
            <span><strong>₹${total}</strong></span>
        </div>
    `;
}
</script>
{% endblock %}
