{% extends "base.html" %}

{% block title %}Product Detail - Shopease{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-6">
            <div class="product-image-container">
                <img id="product-image" src="" alt="" class="img-fluid rounded shadow">
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="product-details">
                <h1 id="product-name" class="display-5 fw-bold mb-3"></h1>
                <p id="product-description" class="lead text-muted mb-4"></p>
                <div id="product-price" class="display-6 fw-bold text-primary mb-4"></div>
                
                <div class="d-flex gap-3 mb-4">
                    <button class="btn btn-primary btn-lg" onclick="addToCart({{ product_id }})">
                        <i class="fas fa-cart-plus me-2"></i>Add to Cart
                    </button>
                    <button class="btn btn-outline-danger btn-lg" onclick="toggleWishlist({{ product_id }})">
                        <i class="fas fa-heart me-2"></i>Add to Wishlist
                    </button>
                </div>
                
                <div class="product-info">
                    <h5>Product Information</h5>
                    <ul class="list-unstyled">
                        <li><strong>Stock:</strong> <span id="stock-quantity"></span> items available</li>
                        <li><strong>Category:</strong> <span id="product-category"></span></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Reviews Section -->
    <div class="row mt-5">
        <div class="col-12">
            <h3>Customer Reviews</h3>
            <div id="reviews-container">
                <!-- Reviews will be loaded here -->
            </div>
        </div>
    </div>
</div>

<script>
// Load product details on page load
document.addEventListener('DOMContentLoaded', async () => {
    const productId = {{ product_id }};
    
    try {
        // Load product details
        const product = await apiCall(`/products/${productId}`);
        
        document.getElementById('product-name').textContent = product.name;
        document.getElementById('product-description').textContent = product.description || 'No description available';
        document.getElementById('product-price').textContent = `₹${product.price}`;
        document.getElementById('product-image').src = product.image_url || 'https://via.placeholder.com/500x500';
        document.getElementById('product-image').alt = product.name;
        document.getElementById('stock-quantity').textContent = product.stock_quantity;
        document.getElementById('product-category').textContent = product.category?.name || 'Uncategorized';
        
        // Load reviews
        const reviews = await apiCall(`/products/${productId}/reviews`);
        displayReviews(reviews);
        
    } catch (error) {
        showAlert('Failed to load product details', 'error');
    }
});

function displayReviews(reviews) {
    const container = document.getElementById('reviews-container');
    
    if (reviews.length === 0) {
        container.innerHTML = '<p class="text-muted">No reviews yet. Be the first to review this product!</p>';
        return;
    }
    
    container.innerHTML = reviews.map(review => `
        <div class="card mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <h6>${review.user.full_name}</h6>
                    <div class="text-warning">
                        ${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}
                    </div>
                </div>
                <p class="mb-1">${review.comment || ''}</p>
                <small class="text-muted">${new Date(review.created_at).toLocaleDateString()}</small>
            </div>
        </div>
    `).join('');
}
</script>
{% endblock %}
