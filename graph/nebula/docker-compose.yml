
networks:
  nebula-net:
    driver: bridge

x-ulimits: &ul
  nofile:
    soft: 1048576
    hard: 1048576

services:
  metad:
    image: vesoft/nebula-metad:v3.6.0
    container_name: nebula-metad
    restart: unless-stopped
    networks: [nebula-net]
    ports:
      - "9559:9559"
      - "19559:19559"
    volumes:
      - ./data/meta:/data/metad
      - ./logs/meta:/logs
    ulimits: *ul
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=metad
      - --ws_ip=metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/metad
      - --log_dir=/logs
    healthcheck:
      # no curl dependency; use nc
      test: ["CMD-SHELL", "printf 'GET /status HTTP/1.0\r\n\r\n' | nc -w 2 127.0.0.1 19559 | grep -qi running"]
      interval: 5s
      timeout: 3s
      retries: 120

  storaged:
    image: vesoft/nebula-storaged:v3.6.0
    container_name: nebula-storaged
    depends_on:
      metad:
        condition: service_healthy
    restart: unless-stopped
    networks: [nebula-net]
    ports:
      - "9779:9779"
      - "19779:19779"
    volumes:
      - ./data/storage:/data/storaged
      - ./logs/storage:/logs
    ulimits: *ul
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=storaged
      - --ws_ip=storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storaged
      - --log_dir=/logs
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /status HTTP/1.0\r\n\r\n' | nc -w 2 127.0.0.1 19779 | grep -qi running"]
      interval: 5s
      timeout: 3s
      retries: 120

  graphd:
    image: vesoft/nebula-graphd:v3.6.0
    container_name: nebula-graphd
    depends_on:
      metad:
        condition: service_healthy
      storaged:
        condition: service_healthy
    restart: unless-stopped
    networks: [nebula-net]
    ports:
      - "9669:9669"
      - "19669:19669"
    volumes:
      - ./data/graph:/data/graphd
      - ./logs/graph:/logs
    ulimits: *ul
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=graphd
      - --ws_ip=graphd
      - --port=9669
      - --ws_http_port=19669
      - --data_path=/data/graphd
      - --log_dir=/logs
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /status HTTP/1.0\r\n\r\n' | nc -w 2 127.0.0.1 19669 | grep -qi running"]
      interval: 5s
      timeout: 3s
      retries: 120
