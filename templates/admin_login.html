{% extends "base.html" %}

{% block title %}Admin Login - Shopease{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-warning">
                <div class="card-header bg-warning text-dark text-center">
                    <i class="fas fa-shield-alt" style="font-size: 2rem;"></i>
                    <h3 class="mt-2 mb-0">Admin Login</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        Secure admin access to platform management
                    </div>
                    
                    <form id="admin-login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope me-2"></i>Admin Email
                            </label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-2"></i>Password
                            </label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Keep me signed in (secure device only)
                            </label>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning btn-lg text-dark">
                                <i class="fas fa-sign-in-alt me-2"></i>Access Admin Panel
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-2">Need admin access? <a href="/admin/register" class="text-primary">Request Registration</a></p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="/customer/login" class="text-muted small">Customer Login</a>
                            <span class="text-muted">|</span>
                            <a href="/seller/login" class="text-muted small">Seller Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
        await login(email, password);
        
        // Redirect to admin dashboard after successful login
        if (currentUser && currentUser.role === 'ADMIN') {
            window.location.href = '/admin/dashboard';
        }
    } catch (error) {
        console.error('Admin login failed:', error);
    }
});
</script>
{% endblock %}
