{% extends "base.html" %}

{% block title %}Seller Login - Shopease{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="fas fa-store text-success" style="font-size: 3rem;"></i>
                        <h2 class="mt-3">Seller Login</h2>
                        <p class="text-muted">Access your seller dashboard</p>
                    </div>
                    
                    <form id="seller-login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope me-2"></i>Email Address
                            </label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-2"></i>Password
                            </label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>Access Dashboard
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-2">Don't have a seller account? <a href="/seller/register" class="text-primary">Become a Seller</a></p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="/customer/login" class="text-muted small">Customer Login</a>
                            <span class="text-muted">|</span>
                            <a href="/admin/login" class="text-muted small">Admin Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('seller-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
        await login(email, password);
        
        // Redirect to seller dashboard after successful login
        if (currentUser && currentUser.role === 'SELLER') {
            window.location.href = '/seller/dashboard';
        }
    } catch (error) {
        console.error('Seller login failed:', error);
    }
});
</script>
{% endblock %}
