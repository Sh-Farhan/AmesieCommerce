{% extends "base.html" %}

{% block title %}My Products - Seller Dashboard{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-3">
            <div class="card">
                <div class="card-body text-center">
                    <div class="mb-3">
                        <i class="fas fa-store" style="font-size: 4rem; color: #667eea;"></i>
                    </div>
                    <h5 id="store-name">Loading...</h5>
                    <p class="text-muted" id="seller-email">Loading...</p>
                    <div class="d-flex justify-content-center align-items-center mb-2">
                        <span class="text-warning me-2">★★★★☆</span>
                        <span id="store-rating">0.0</span>
                    </div>
                </div>
            </div>
            
            <div class="list-group mt-4">
                <a href="/seller/dashboard" class="list-group-item list-group-item-action">
                    <i class="fas fa-chart-pie me-2"></i>Dashboard
                </a>
                <a href="/seller/products" class="list-group-item list-group-item-action active">
                    <i class="fas fa-box me-2"></i>My Products
                </a>
                <a href="/seller/orders" class="list-group-item list-group-item-action">
                    <i class="fas fa-shopping-bag me-2"></i>Orders
                </a>
                <a href="/seller/profile" class="list-group-item list-group-item-action">
                    <i class="fas fa-user me-2"></i>Store Profile
                </a>
                <a href="/" class="list-group-item list-group-item-action">
                    <i class="fas fa-home me-2"></i>Back to Store
                </a>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>My Products</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">
                    <i class="fas fa-plus me-2"></i>Add New Product
                </button>
            </div>
            
            <!-- Products Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="products-tbody">
                                <!-- Products will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Product Modal -->
<div class="modal fade" id="addProductModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="productName" class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="productName" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="productCategory" class="form-label">Category</label>
                                <select class="form-select" id="productCategory" required>
                                    <!-- Categories will be loaded here -->
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="productDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="productDescription" rows="3" required></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="productPrice" class="form-label">Price (₹)</label>
                                <input type="number" class="form-control" id="productPrice" min="0" step="0.01" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="productStock" class="form-label">Stock Quantity</label>
                                <input type="number" class="form-control" id="productStock" min="0" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="productImage" class="form-label">Image URL</label>
                        <input type="url" class="form-control" id="productImage" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>
</div>

<script>
let categories = [];

document.addEventListener('DOMContentLoaded', async () => {
    if (!currentUser || currentUser.role !== 'SELLER') {
        showAlert('Access denied. Seller role required.', 'error');
        window.location.href = '/login';
        return;
    }
    
    await loadSellerProfile();
    await loadCategories();
    await loadProducts();
});

async function loadSellerProfile() {
    try {
        const profile = await apiCall('/sellers/profile');
        document.getElementById('store-name').textContent = profile.store_name;
        document.getElementById('seller-email').textContent = profile.user.email;
        document.getElementById('store-rating').textContent = profile.rating.toFixed(1);
        
        const ratingStars = Math.round(profile.rating);
        const starsElement = document.querySelector('.text-warning');
        starsElement.textContent = '★'.repeat(ratingStars) + '☆'.repeat(5 - ratingStars);
    } catch (error) {
        console.error('Failed to load seller profile:', error);
    }
}

async function loadCategories() {
    try {
        categories = await apiCall('/products/categories');
        const select = document.getElementById('productCategory');
        select.innerHTML = '<option value="">Select Category</option>' +
            categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
    } catch (error) {
        console.error('Failed to load categories:', error);
    }
}

async function loadProducts() {
    try {
        const products = await apiCall('/sellers/products');
        const tbody = document.getElementById('products-tbody');
        
        if (products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No products yet. Add your first product!</td></tr>';
            return;
        }
        
        tbody.innerHTML = products.map(product => `
            <tr>
                <td>
                    <div class="d-flex align-items-center">
                        <img src="${product.image_url}" alt="${product.name}" class="img-thumbnail me-3" style="width: 50px; height: 50px; object-fit: cover;">
                        <div>
                            <h6 class="mb-0">${product.name}</h6>
                            <small class="text-muted">${product.description.substring(0, 50)}...</small>
                        </div>
                    </div>
                </td>
                <td>${product.category.name}</td>
                <td>₹${product.price.toLocaleString()}</td>
                <td>
                    <span class="badge bg-${product.stock_quantity < 10 ? 'warning' : 'success'}">
                        ${product.stock_quantity}
                    </span>
                </td>
                <td>
                    <span class="badge bg-${product.stock_quantity > 0 ? 'success' : 'danger'}">
                        ${product.stock_quantity > 0 ? 'In Stock' : 'Out of Stock'}
                    </span>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editProduct(${product.id})" title="Edit">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${product.id})" title="Delete">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    } catch (error) {
        console.error('Failed to load products:', error);
    }
}

async function saveProduct() {
    const form = document.getElementById('productForm');
    const productId = document.getElementById('productId').value;
    
    const productData = {
        name: document.getElementById('productName').value,
        description: document.getElementById('productDescription').value,
        price: parseFloat(document.getElementById('productPrice').value),
        image_url: document.getElementById('productImage').value,
        stock_quantity: parseInt(document.getElementById('productStock').value),
        category_id: parseInt(document.getElementById('productCategory').value)
    };
    
    try {
        if (productId) {
            // Update existing product
            await apiCall(`/sellers/products/${productId}`, {
                method: 'PUT',
                body: JSON.stringify(productData)
            });
            showAlert('Product updated successfully!', 'success');
        } else {
            // Create new product
            await apiCall('/sellers/products', {
                method: 'POST',
                body: JSON.stringify(productData)
            });
            showAlert('Product added successfully!', 'success');
        }
        
        // Close modal and reload products
        const modal = bootstrap.Modal.getInstance(document.getElementById('addProductModal'));
        modal.hide();
        form.reset();
        document.getElementById('productId').value = '';
        await loadProducts();
    } catch (error) {
        showAlert('Failed to save product: ' + error.message, 'error');
    }
}

async function editProduct(productId) {
    try {
        const products = await apiCall('/sellers/products');
        const product = products.find(p => p.id === productId);
        
        if (!product) {
            showAlert('Product not found', 'error');
            return;
        }
        
        // Fill form with product data
        document.getElementById('productId').value = product.id;
        document.getElementById('productName').value = product.name;
        document.getElementById('productDescription').value = product.description;
        document.getElementById('productPrice').value = product.price;
        document.getElementById('productImage').value = product.image_url;
        document.getElementById('productStock').value = product.stock_quantity;
        document.getElementById('productCategory').value = product.category_id;
        
        // Show modal
        const modal = new bootstrap.Modal(document.getElementById('addProductModal'));
        modal.show();
    } catch (error) {
        showAlert('Failed to load product details', 'error');
    }
}

async function deleteProduct(productId) {
    if (!confirm('Are you sure you want to delete this product?')) {
        return;
    }
    
    try {
        await apiCall(`/sellers/products/${productId}`, {
            method: 'DELETE'
        });
        showAlert('Product deleted successfully!', 'success');
        await loadProducts();
    } catch (error) {
        showAlert('Failed to delete product: ' + error.message, 'error');
    }
}
</script>
{% endblock %}
