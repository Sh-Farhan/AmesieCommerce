{% extends "base.html" %}

{% block title %}Seller Registration - Shopease{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="fas fa-store text-success" style="font-size: 3rem;"></i>
                        <h2 class="mt-3">Become a Seller</h2>
                        <p class="text-muted">Start your online business with Shopease</p>
                    </div>
                    
                    <form id="seller-register-form">
                        <div class="row">
                            <div class="col-md-6">
                                <h5 class="mb-3"><i class="fas fa-user me-2"></i>Personal Information</h5>
                                
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="fullName" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" required minlength="6">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <h5 class="mb-3"><i class="fas fa-store me-2"></i>Store Information</h5>
                                
                                <div class="mb-3">
                                    <label for="storeName" class="form-label">Store Name</label>
                                    <input type="text" class="form-control" id="storeName" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="storeDescription" class="form-label">Store Description</label>
                                    <textarea class="form-control" id="storeDescription" rows="3"></textarea>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="storeAddress" class="form-label">Store Address</label>
                                    <textarea class="form-control" id="storeAddress" rows="2" required></textarea>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="businessLicense" class="form-label">Business License Number</label>
                                    <input type="text" class="form-control" id="businessLicense">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="gstNumber" class="form-label">GST Number</label>
                                    <input type="text" class="form-control" id="gstNumber">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="bankAccount" class="form-label">Bank Account Number</label>
                                    <input type="text" class="form-control" id="bankAccount">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="bankIfsc" class="form-label">Bank IFSC Code</label>
                                    <input type="text" class="form-control" id="bankIfsc">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                            <label class="form-check-label" for="agreeTerms">
                                I agree to the <a href="#" class="text-primary">Seller Terms & Conditions</a> and <a href="#" class="text-primary">Commission Structure</a>
                            </label>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-store me-2"></i>Create Seller Account
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-2">Already have a seller account? <a href="/seller/login" class="text-primary">Sign In</a></p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="/customer/register" class="text-muted small">Customer Registration</a>
                            <span class="text-muted">|</span>
                            <a href="/admin/register" class="text-muted small">Admin Access</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('seller-register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    if (password !== confirmPassword) {
        showAlert('Passwords do not match', 'error');
        return;
    }
    
    const userData = {
        full_name: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        phone_number: document.getElementById('phone').value,
        password: password
    };
    
    const sellerData = {
        store_name: document.getElementById('storeName').value,
        store_description: document.getElementById('storeDescription').value,
        store_address: document.getElementById('storeAddress').value,
        business_license: document.getElementById('businessLicense').value,
        gst_number: document.getElementById('gstNumber').value,
        bank_account_number: document.getElementById('bankAccount').value,
        bank_ifsc_code: document.getElementById('bankIfsc').value
    };
    
    try {
        showSpinner();
        
        const formData = new FormData();
        Object.keys(userData).forEach(key => {
            formData.append(key, userData[key]);
        });
        Object.keys(sellerData).forEach(key => {
            formData.append(key, sellerData[key]);
        });
        
        const response = await fetch('/api/auth/register/seller', {
            method: 'POST',
            body: formData,
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Registration failed');
        }
        
        showAlert('Seller registration successful! Please login to continue.', 'success');
        window.location.href = '/seller/login';
        
    } catch (error) {
        showAlert(error.message, 'error');
    } finally {
        hideSpinner();
    }
});
</script>
{% endblock %}
